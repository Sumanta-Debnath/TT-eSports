<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <title>admin dashboard</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/admindashboard.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
   </head>
<body>
  <div class="sidebar">
    <div class="logo-details">
      <i class='bx bxs-user'></i>
      <span class="logo_name">TT e-Sports <br> Admin Dashboard</span>
    </div>
      <ul class="nav-links">
        <li>
          <a href="">
            <i class='bx bx-user' ></i>
            <span class="links_name">User Details</span>
          </a>
        </li>
        <li>
          <a href="">
            <i class='bx bx-list-ul' ></i>
            <span class="links_name">Tournament Details</span>
          </a>
        </li>
        <li>
          <a href="">
            <i class='bx bx-pie-chart-alt-2' ></i>
            <span class="links_name">Booking Details</span>
          </a>
        </li>
        <li>
          <a href="">
            <i class='bx bx-coin-stack' ></i>
            <span class="links_name">Payment Details</span>
          </a>
        </li>
        <li class="log_out">
          <a href="">
            <i class='bx bx-log-out'></i>
            <span class="links_name">Log out</span>
          </a>
        </li>
      </ul>
  </div>
  

  <script>
   let sidebar = document.querySelector(".sidebar");
let sidebarBtn = document.querySelector(".sidebarBtn");
sidebarBtn.onclick = function() {
  sidebar.classList.toggle("active");
  if(sidebar.classList.contains("active")){
  sidebarBtn.classList.replace("bx-menu" ,"bx-menu-alt-right");
}else
  sidebarBtn.classList.replace("bx-menu-alt-right", "bx-menu");
}
 </script>

</body>
</html>
