<!DOCTYPE html>
<html>
    <title>available</title>
    <head>
        <link rel="stylesheet" href="../css/available.css">
        </head>
        <body>
        <div class="container">
            <img src="../images/branding/logo1.png" class="logo" />
            <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12">
            <div class="card h-100">
                <div class="card-body">
                    <div class="row gutters">
                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                            <h2 class="mb-2 text-primary">Table Booking Details</h2>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                            <div class="form-group">
                                <label for="fullName">Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter Name" required>
                            </div>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                            <div class="form-group">
                                <label for="eMail">Email</label>
                                <input type="email" class="form-control" id="eMail" placeholder="Enter Email Id" required>
                            </div>
                        </div>
                        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="text" class="form-control" id="phone" placeholder="Enter Phone Number" required>
                            </div>
                        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                            <div class="date-number">
                                <label> Expiry Date </label>
                                <input type="text" class="date-number-field" 
                                       placeholder="" />
                              </div>
                        </div>
                    </div>
                    <div class="row gutters">
                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                            <div class="text-right">
                                <a href="available.html">
                                <button type="button" id="submit" name="submit" class="btn btn-secondary">Check Availability</button></a>
                                <a href="available.html">
                                <button type="button" id="submit" name="submit" class="btn btn-primary">Cancel</button>
                            </a>
                            </div>
                        </div>
         </div>
      </div>
     </div>
   </div>
 </body>
</html>
